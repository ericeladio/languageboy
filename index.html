<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>LanguageBoy</title>
        <link rel="icon" href="docs/Logo-light.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="docs/Logo-light.png">
        <meta name="viewport" content="width = device-width, initial-scale = 1">
        <style>
            :root {
                --neon: #4da9ff;
                --neon-strong: #1aafff;
                --ink: #eaf6ff;
                --muted: #9fc7ea;
            }

            * {
                box-sizing: border-box;
            }

            html {
                min-height: 100%;
                background-color: #05070a;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: clamp(24px, 6vh, 64px) 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: clamp(20px, 3.5vh, 30px);
                overflow-x: hidden;
                background:
                    radial-gradient(55% 45% at 50% 0%, rgba(26, 175, 255, 0.14), transparent 72%),
                    #05070a;
                color: var(--muted);
                font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
                text-align: center;
            }

            #top {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
            }

            .logo {
                width: 76px;
                height: 76px;
                flex: 0 0 auto;
                filter: drop-shadow(0 0 10px rgba(26, 175, 255, 0.75));
            }

            .brand {
                text-align: left;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.8rem, 4.5vw, 2.6rem);
                line-height: 1;
                letter-spacing: 0.02em;
                color: var(--neon);
                text-shadow: 0 0 6px rgba(26, 175, 255, 0.85), 0 0 22px rgba(26, 175, 255, 0.45);
            }

            .tagline {
                margin: 7px 0 0;
                font-size: 0.72rem;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: #6fb2e8;
            }

            #box {
                position: relative;
                width: min(560px, 100%);
                min-height: 250px;
                padding: 34px 28px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                overflow: hidden;
                border: 2px dashed rgba(77, 169, 255, 0.5);
                border-radius: 20px;
                background:
                    radial-gradient(120% 100% at 50% 0%, rgba(26, 175, 255, 0.1), transparent 65%),
                    rgba(255, 255, 255, 0.02);
                color: var(--muted);
                cursor: pointer;
                transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            }

            #box:hover, #box[drag] {
                border-color: var(--neon-strong);
                border-style: solid;
                transform: translateY(-2px);
                box-shadow: 0 0 0 1px rgba(26, 175, 255, 0.35), 0 16px 50px rgba(26, 175, 255, 0.18);
            }

            .upload-icon {
                width: 52px;
                height: 52px;
                margin-bottom: 4px;
                color: var(--neon);
                filter: drop-shadow(0 0 8px rgba(26, 175, 255, 0.6));
                transition: transform 0.2s;
            }

            #box:hover .upload-icon {
                transform: translateY(-3px);
            }

            .upload-icon svg {
                width: 100%;
                height: 100%;
            }

            .drop-title {
                margin: 0;
                font-size: 1.05rem;
                font-weight: 700;
                color: var(--ink);
            }

            .drop-hint {
                margin: 0;
                font-size: 0.82rem;
                color: #91b9dd;
            }

            .formats {
                display: flex;
                gap: 8px;
                margin-top: 8px;
            }

            .formats span {
                padding: 3px 11px;
                border: 1px solid rgba(77, 169, 255, 0.45);
                border-radius: 999px;
                background-color: rgba(26, 175, 255, 0.08);
                color: #8fd0ff;
                font-size: 0.68rem;
                letter-spacing: 0.14em;
            }

            #intro {
                max-width: 560px;
                margin: 0;
                font-size: 0.86rem;
                line-height: 1.7;
                color: var(--muted);
            }

            #intro strong {
                color: #7fd0ff;
                text-shadow: 0 0 8px rgba(26, 175, 255, 0.55);
            }

            #input {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                cursor: pointer;
            }

            #display {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
            }

            select, button {
                padding: 0.6em 0.9em;
                margin: 0.35em;
                width: min(15em, 100%);
                font-family: inherit;
                font-weight: bold;
                font-size: 0.9rem;
                background-color: #0d1620;
                color: #bfe3ff;
                border-radius: 0.6em;
                border: 1px solid rgba(77, 169, 255, 0.4);
                cursor: pointer;
                transition: background-color 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
            }

            select:hover, button:hover {
                background-color: #122234;
                border-color: var(--neon);
                color: var(--ink);
                box-shadow: 0 0 12px rgba(26, 175, 255, 0.35);
            }

            @media (max-width: 520px) {
                #top {
                    flex-direction: column;
                    gap: 10px;
                }

                .brand {
                    text-align: center;
                }

                .logo {
                    width: 68px;
                    height: 68px;
                }

                #box {
                    min-height: 220px;
                    padding: 28px 20px;
                }
            }
        </style>
    </head>

    <body>
        <div id="top">
            <img src="docs/Logo-light.svg" alt="Logo de LanguageBoy" class="logo">
            <div class="brand">
                <h1>LanguageBoy</h1>
                <p class="tagline">Traductor de GBA · NDS</p>
            </div>
        </div>
        <div id="box">
            <input type="file" id="input" title="Upload" accept=".gba,.nds,.zip" />
            <div class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 16V4"></path>
                    <path d="m7 9 5-5 5 5"></path>
                    <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path>
                </svg>
            </div>
            <p class="drop-title">Arrastra aquí tu ROM</p>
            <p class="drop-hint">o haz clic para elegir un archivo</p>
            <div class="formats">
                <span>GBA</span>
                <span>NDS</span>
            </div>
        </div>
        <div id="intro">
            Emulador para jugar y traducir juegos de <strong>GBA</strong> y <strong>DS</strong>.
            Guarda tus palabras favoritas y expórtalas como tarjetas <strong>Anki</strong>.
        </div>

        <script>
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            let enableDebug = parseInt(urlParams.get("debug")) === 1 || urlParams.get("debug") === "true";
            let enableThreads = false;
            let browserMode;

            window.EJS_cacheConfig = {
                enabled: true,
                cacheMaxSizeMB: 4096,
                cacheMaxAgeMins: 7200
            };

            if (window.SharedArrayBuffer && (parseInt(urlParams.get("threads")) === 1 || urlParams.get("threads") === "true")) {
                enableThreads = true;
            }

            const requestedBrowserMode = urlParams.get("browserMode");
            if (requestedBrowserMode === "mobile" || requestedBrowserMode === "1") {
                browserMode = "mobile";
            } else if (requestedBrowserMode === "desktop" || requestedBrowserMode === "2") {
                browserMode = "desktop";
            }

            const supportedExtensions = ["gba", "nds", "zip"];

            if (urlParams.get("rom")) {
                console.log(`Loading ROM from URL: roms/${urlParams.get("rom")}`);
                run(false, urlParams.get("rom"));
            }

            function getCore(ext) {
                ext = (ext || "").toLowerCase();
                if (ext === "gba" || ext === "nds") return Promise.resolve(ext);
                if (ext !== "zip") return Promise.resolve(null);

                return new Promise(resolve => {
                    const cores = {
                        "Nintendo Game Boy Advance": "gba",
                        "Nintendo DS": "nds"
                    };
                    const button = document.createElement("button");
                    const select = document.createElement("select");

                    for (const type in cores) {
                        const option = document.createElement("option");
                        option.value = cores[type];
                        option.textContent = type;
                        select.appendChild(option);
                    }

                    button.onclick = () => resolve(select[select.selectedIndex].value);
                    button.textContent = "Load game";
                    box.innerHTML = "";
                    box.appendChild(select);
                    box.appendChild(button);
                });
            }

            function unsupportedRom() {
                const message = "Por ahora solo se admiten ROMs de GBA y DS.";
                if (typeof box !== "undefined" && box) box.textContent = message;
                else alert(message);
            }

            async function run(upload, file) {
                const fileName = upload ? input.files[0].name : file;
                const parts = fileName.split(".");
                const ext = (parts.pop() || "").toLowerCase();
                const core = supportedExtensions.includes(ext) ? await getCore(ext) : null;
                if (!core) {
                    unsupportedRom();
                    return;
                }
                const url = upload ? input.files[0] : `roms/${file}`;

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove();
                const intro = document.getElementById("intro");
                if (intro) intro.remove();
                div.appendChild(sub);
                document.body.appendChild(div)

                window.EJS_player = "#game";
                window.EJS_gameName = parts.join(".");
                window.EJS_biosUrl = "";
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_threads = enableThreads;
                if (browserMode) {
                    window.EJS_browserMode = browserMode;
                }
                window.EJS_Buttons = {
                    exitEmulation: false
                };
                window.EJS_askBeforeExit = false;
                window.EJS_onExit = () => {
                        alert("The emulator has exited. This callback can be used to do any cleanup or show a message to the user.");
                    };

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                if (!input.files[0]) return;
                const ext = (input.files[0].name.split(".").pop() || "").toLowerCase();
                if (!supportedExtensions.includes(ext)) {
                    input.value = "";
                    unsupportedRom();
                    return;
                }
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
