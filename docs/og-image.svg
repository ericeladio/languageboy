  <text x="600" y="338" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="82" font-weight="600" letter-spacing="-1" fill="#eaf6ff">LanguageBoy</text>

  <text x="600" y="396" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="32" font-weight="500" letter-spacing="1" fill="#9fc7ea">Traductor de GBA · NDS</text>

  <rect x="300" y="432" width="600" height="2" fill="url(#line)"/>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="25" font-weight="600" text-anchor="middle">
